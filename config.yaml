# Configurazione per dataset, modello e training.

data:
  csv_path: "data/raw/PL_cleaned_index.csv"
  processed_dir: "data/processed"
  limit: 1000
  seed: 47

model:
  token_dim: 16
  node_embedding_dim: 48
  edge_embedding_dim: 32
  lr: 0.0005
  dropout_p: 0.1
  normalization: true

training:
  batch_size: 16
  epochs: 100
  use_amp: true
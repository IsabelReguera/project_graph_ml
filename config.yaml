# Configurazione per dataset, modello e training.

data:
  csv_path: "data/raw/PL_cleaned_index.csv"
  processed_dir: "data/processed"
  log_dir: "lightning_logs"
  limit: 1000
  seed: 47

model:
  experiment_name: "gmn_model"
  model_type: "gmn"  # Options: "baseline", "gmn"
  token_dim: 16
  node_embedding_dims: 
  - 48
  edge_embedding_dims: 
  - 32
  lr: 0.00001
  dropout_p: 0.0
  normalization: True
  num_layers: 1

training:
  batch_size: 16
  epochs: 700
  patience: 20
  use_amp: true
# Configurazione per dataset, modello e training.

data:
  csv_path: "data/raw/PL_cleaned_index.csv"
  processed_dir: "data/processed"
  log_dir: "lightning_logs"
  limit: 2000
  seed: 47

model:
  experiment_name: "gmn_emb_norm_dyn"
  model_type: "gmn"  # Options: "baseline", "gmn"
  token_dim: 64
  node_embedding_dims: 
  - 32
  - 16
  edge_embedding_dims: 
  - 32 
  - 16
  lr: 0.0006
  l2_norm: 0.0
  dropout_p: 0.12
  normalization: True
  num_layers: 1
  use_dynamic_schedule: True
  max_lr: 1.0e-3
  min_lr: 1.0e-6
  warmup_percentage: 0.75

training:
  batch_size: 32
  epochs: 700
  patience: 30
  use_amp: true
# Configuration A -- current hyperparameters (dense encoder).
# Reproduces the baseline of the previous embedding ablation, so that we
# have a reference point under the same training script.

data:
  csv_path: "data/raw/PL_cleaned_index.csv"
  processed_dir: "data/processed"
  log_dir: "experiment_parameters_PLAGCA/runs"
  limit: 3500
  seed: 47

model:
  model_variant: "default"          # uses src/baseline.py / src/graphmatchingnetwork.py
  embedding_type: "dense"
  cat_emb_dim: 8
  token_dim: 64                     # unused when embedding_type == dense, kept for signature compat
  node_embedding_dims: [32, 16]
  edge_embedding_dims: [32, 16]
  num_layers: 1
  dropout_p: 0.12
  normalization: true
  lr: 0.0006
  max_lr: 0.001
  min_lr: 0.000001
  l2_norm: 0.01
  warmup_percentage: 0.075
  use_dynamic_schedule: true
  mlp_hidden_sizes: null            # ignored by the default model, keeps the hardcoded head

training:
  batch_size: 32
  epochs: 1000
  patience: 30

graph_filters:
  protein_max_distance: null
  ligand_bonds_only: false
